services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:1883:1883"
    volumes:
      - mqtt-data:/mosquitto/data
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    logging:
      driver: local
      options:
        max-size: "2m"
        max-file: "2"
    restart: unless-stopped

  pypotter:
    build: .
    depends_on:
      - mqtt
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYPOTTER_API_TOKEN: "${PYPOTTER_API_TOKEN:-}"
      PYPOTTER_ENABLE_HOME_ASSISTANT: "${PYPOTTER_ENABLE_HOME_ASSISTANT:-false}"
      PYPOTTER_HOME_ASSISTANT_URL: "${PYPOTTER_HOME_ASSISTANT_URL:-}"
      PYPOTTER_HOME_ASSISTANT_TOKEN: "${PYPOTTER_HOME_ASSISTANT_TOKEN:-}"
      PYPOTTER_ENABLE_MQTT: "${PYPOTTER_ENABLE_MQTT:-false}"
      PYPOTTER_MQTT_HOST: "${PYPOTTER_MQTT_HOST:-mqtt}"
      PYPOTTER_MQTT_PORT: "${PYPOTTER_MQTT_PORT:-1883}"
      PYPOTTER_MQTT_USERNAME: "${PYPOTTER_MQTT_USERNAME:-}"
      PYPOTTER_MQTT_PASSWORD: "${PYPOTTER_MQTT_PASSWORD:-}"
      PYPOTTER_MQTT_DISCOVERY_PREFIX: "${PYPOTTER_MQTT_DISCOVERY_PREFIX:-homeassistant}"
      PYPOTTER_MQTT_TOPIC_PREFIX: "${PYPOTTER_MQTT_TOPIC_PREFIX:-pypotter}"
      PYPOTTER_MQTT_CLIENT_ID: "${PYPOTTER_MQTT_CLIENT_ID:-pypotter}"
      PYPOTTER_MQTT_TLS: "${PYPOTTER_MQTT_TLS:-false}"
      PYPOTTER_EDGE_MODE: "${PYPOTTER_EDGE_MODE:-on}"
      PYPOTTER_LOG_LEVEL: "${PYPOTTER_LOG_LEVEL:-WARNING}"
      PYPOTTER_ACCESS_LOG: "${PYPOTTER_ACCESS_LOG:-false}"
      PYPOTTER_MAX_CONNECTIONS: "${PYPOTTER_MAX_CONNECTIONS:-16}"
      PYPOTTER_MAX_REQUEST_BODY_BYTES: "${PYPOTTER_MAX_REQUEST_BODY_BYTES:-8388608}"
      PYPOTTER_MAX_IMAGE_BYTES: "${PYPOTTER_MAX_IMAGE_BYTES:-4194304}"
      PYPOTTER_MAX_IMAGE_PIXELS: "${PYPOTTER_MAX_IMAGE_PIXELS:-4000000}"
      PYPOTTER_MAX_IMAGE_DIMENSION: "${PYPOTTER_MAX_IMAGE_DIMENSION:-4096}"
    stop_grace_period: 20s
    volumes:
      - pypotter-data:/data
    logging:
      driver: local
      options:
        max-size: "2m"
        max-file: "2"
    restart: unless-stopped

volumes:
  mqtt-data:
  pypotter-data:
