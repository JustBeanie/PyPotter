[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pypotter"
version = "2.0.0"
description = "Control Home Assistant with wand gestures, with a local web application."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
authors = [{ name = "Adam Thole" }]
dependencies = [
  "alembic>=1.20.0,<2",
  "fastapi>=0.143.0,<1",
  "numpy>=2.5.3,<3",
  "opencv-python-headless>=5.0.0.93,<6",
  "paho-mqtt>=2.1,<3",
  "pydantic-settings>=2.15.0,<3",
  "python-multipart>=0.0.20,<1",
  "requests>=2.34.2,<3",
  "sqlalchemy>=2.1.4,<3",
  "uvicorn[standard]>=0.54.0,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=2.4.0,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.10,<1",
]
integration = ["playwright>=1.63.0,<2"]

[project.scripts]
pypotter = "pypotter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pypotter"]

[tool.hatch.build.targets.sdist]
exclude = ["/.uv-cache", "/.venv", "/.venv312", "/dist", "/.pytest-tmp"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["PyPotter.py", "HassApi.py", "CountsPerSec.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["pypotter"]

[tool.mypy]
python_version = "3.12"
packages = ["pypotter"]
ignore_missing_imports = true
check_untyped_defs = true
