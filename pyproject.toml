[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pypotter"
version = "2.0.0"
description = "Control Home Assistant with wand gestures, with a local web application."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
authors = [{ name = "Adam Thole" }]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "requests>=2.34.2,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
integration = ["playwright>=1.50,<2"]

[project.scripts]
pypotter = "pypotter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pypotter"]

[tool.hatch.build.targets.sdist]
exclude = ["/.uv-cache", "/.venv", "/.venv312", "/dist", "/.pytest-tmp"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["PyPotter.py", "HassApi.py", "CountsPerSec.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["pypotter"]

[tool.mypy]
python_version = "3.12"
packages = ["pypotter"]
ignore_missing_imports = true
check_untyped_defs = true
